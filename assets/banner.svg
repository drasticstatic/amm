    <path class="draw" pathLength="100" d="M620 183.3Q689.6 172.9 759.2 183.3Q828.8 193.7 898.4 183.3Q968.0 172.9 1037.6 183.3Q1107.2 193.7 1176.8 183.3Q1246.4 172.9 1316.0 183.3" fill="none" stroke="url(#fade)" stroke-width="2.8000000000000003" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.90s"/>
    <path class="draw" pathLength="100" d="M620 202.7Q681.0 217.5 742.1 202.7Q803.1 187.9 864.1 202.7Q925.2 217.5 986.2 202.7Q1047.2 187.9 1108.3 202.7Q1169.3 217.5 1230.3 202.7Q1291.4 187.9 1352.4 202.7" fill="none" stroke="url(#fade)" stroke-width="2.4000000000000004" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.40s"/>
    <path class="draw" pathLength="100" d="M620 222.0Q691.7 237.5 763.3 222.0Q835.0 206.5 906.7 222.0Q978.4 237.5 1050.0 222.0Q1121.7 206.5 1193.4 222.0Q1265.0 237.5 1336.7 222.0" fill="none" stroke="url(#fade)" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.90s"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#1a1a2e"/><rect x="300.0" y="248" width="300.5" height="12" fill="#5c1a2b"/><rect x="600.0" y="248" width="300.5" height="12" fill="#800020"/><rect x="900.0" y="248" width="300.5" height="12" fill="#fbeef1"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="72.0" fill="#c78f9d" font-size="15" font-weight="700" letter-spacing=".6">DappU mentorship</text><text x="56" y="137.6" fill="#fbeef1" font-size="60" font-weight="700" letter-spacing="-.5">amm</text><text x="56" y="181.4" fill="#dcd0d6" font-size="23">Swap, provide liquidity, withdraw: x · y = k</text></g>
  </g>
